syntax = "proto2";

// Fixture for `make check-schema`: an infinite double option has no Lua literal.

import "google/protobuf/descriptor.proto";

extend google.protobuf.MessageOptions {
  optional double opt_double = 50001;
}

message NonFinite {
  // protoc 3.x rejects the `inf` identifier; an overflowing literal still parses to infinity.
  option (opt_double) = 1e999;
}
